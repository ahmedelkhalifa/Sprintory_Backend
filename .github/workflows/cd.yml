name: Backend CD

# Only deploy a successful Backend CI run caused by a push to main.
# A manual rerun is also available from main. CD remains disabled until
# the VPS .env, Docker Hub image, and SSH credentials are configured.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprintory-backend-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: >-
      ${{ vars.SPRINTORY_CD_ENABLED == 'true' &&
          ((github.event_name == 'workflow_run' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.conclusion == 'success') ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ vars.VPS_HOST }}
      DEPLOY_USER: ${{ vars.VPS_USER }}

    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IMAGE_SHA }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for key in IMAGE DOCKERHUB_USER DOCKERHUB_TOKEN DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing configuration: $key" >&2
              exit 1
            fi
          done
          if [[ ! "$IMAGE" =~ ^[a-z0-9][a-z0-9._/-]*[a-z0-9]$ ]]; then
            echo 'DOCKERHUB_IMAGE must be a lowercase namespace/repository without a tag' >&2
            exit 1
          fi
          if [[ "$IMAGE" != */* || "$DEPLOY_HOST" =~ [^a-zA-Z0-9.:-] || "$DEPLOY_USER" =~ [^a-zA-Z0-9_-] ]]; then
            echo 'Invalid image, VPS_HOST, or VPS_USER' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish immutable and latest tags
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.IMAGE_SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy verified image via SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/sprintory_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          # %q quotes each argument for bash on the remote host.
          printf -v image_arg '%q' "$IMAGE"
          printf -v tag_arg '%q' "sha-$IMAGE_SHA"
          ssh -i "$HOME/.ssh/sprintory_deploy" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -s -- $image_arg $tag_arg" < scripts/deploy_backend.sh
