<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${subject}">Sprintory</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F5EF;color:#182638;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F7F5EF;">
    <tr><td align="center" style="padding:36px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#FFFFFF;border:1px solid #E5E2DA;border-radius:8px;">
            <tr><td style="padding:28px 36px;border-bottom:1px solid #E5E2DA;font-size:22px;font-weight:700;color:#315A85;">Sprintory</td></tr>
            <tr><td style="padding:36px;">
                <p style="margin:0 0 18px;font-size:15px;line-height:1.6;" th:text="|Hi ${name},|">Hi there,</p>
                <h1 style="margin:0 0 18px;font-size:25px;line-height:1.3;color:#182638;" th:text="${heading}">Notification</h1>
                <p style="margin:0 0 26px;font-size:15px;line-height:1.7;color:#667085;white-space:pre-line;" th:text="${message}">Message</p>
                <table th:if="${actionUrl != null}" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 26px;"><tr><td bgcolor="#315A85" style="border-radius:8px;">
                    <a th:href="${actionUrl}" th:text="${actionLabel}" href="#" style="display:inline-block;padding:14px 22px;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;">Open Sprintory</a>
                </td></tr></table>
                <p th:if="${note != null}" th:text="${note}" style="margin:0;font-size:13px;line-height:1.7;color:#667085;">Note</p>
            </td></tr>
            <tr><td style="padding:20px 36px;border-top:1px solid #E5E2DA;font-size:12px;color:#667085;">
                <span th:text="|© ${year} Sprintory|">Sprintory</span>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
