spring.application.name=sprintory_backend
spring.profiles.active= ${SPRING_PROFILES_ACTIVE:dev}

#Database
spring.datasource.url= ${DB_URL}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

#JWT
app.jwt.secret= ${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=2629800000
app.cookie.secure= ${COOKIE_SECURE:false}

#Cors
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

#Dev admin seed - resolved only under the dev profile, no defaults on purpose
app.seed.admin-email=${SEED_ADMIN_EMAIL}
app.seed.admin-password=${SEED_ADMIN_PASSWORD}