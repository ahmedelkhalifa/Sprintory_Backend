spring.application.name=sprintory_backend
spring.profiles.active= ${SPRING_PROFILES_ACTIVE:dev}

#Database
spring.datasource.url= ${DB_URL}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
#Flyway owns the schema only in prod (and in the context test); dev keeps ddl-auto=update
spring.flyway.enabled=false

#JWT
app.jwt.secret= ${JWT_SECRET}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=2629800000
app.cookie.secure= ${COOKIE_SECURE:false}

#Cors
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

#Mail - defaults point to a local Mailpit: docker run -p 1025:1025 -p 8025:8025 axllent/mailpit
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.mail.from=${MAIL_FROM:no-reply@sprintory.local}

#Emailed links - paths on the separate frontend app
app.auth.link-expiration-ms=86400000
app.auth.verify-email-path=${VERIFY_EMAIL_PATH:/verify-email}
app.auth.reset-password-path=${RESET_PASSWORD_PATH:/reset-password}
app.workspace.invite-path=${INVITE_PATH:/accept-invite}
app.workspace.invite-expiration-ms=604800000
# R27 notification emails link to these frontend routes (docs/notifications-docs.md §10, to confirm
# with the frontend). {workspaceId}, {projectId}, {taskId} and {taskKey} are filled in.
app.notifications.task-path=/workspaces/{workspaceId}/projects/{projectId}/tasks/{taskId}
app.notifications.project-path=/workspaces/{workspaceId}/projects/{projectId}
app.notifications.preferences-path=/settings
# Notifications and finished notification emails older than this are deleted nightly (team choice).
app.notifications.retention-days=90

#Attachments (R25) - where the files live (a Docker volume in production; docs/attachments-docs.md §6)
app.attachments.dir=${ATTACHMENTS_DIR:./data/attachments}
#Attachments (R25) - deleted attachments are removed for good after this many days (nightly at 04:10)
app.attachments.retention-days=30
#Attachments (R25) - upload limits: 20 MB per file (AttachmentService.MAX_FILE_BYTES), 5 files per request.
#Larger requests get 413 FILE_TOO_LARGE. Tomcat reads the rest of a refused body so the browser
#receives the 413 instead of a reset connection; Nginx Proxy Manager must allow the same size.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=101MB
server.tomcat.max-swallow-size=110MB
#Attachments (R25) - images are compressed to WebP on upload (docs/attachments-docs.md §3.2).
#Bigger images are stored unconverted; each running conversion can hold ~200 MB of heap.
app.attachments.images.max-dimension=2560
app.attachments.images.quality=0.80
app.attachments.images.max-pixels=40000000
app.attachments.images.max-concurrent=2

#Pagination - ?page= is 0-based, ?size= defaults to 20 and is capped here
spring.data.web.pageable.max-page-size=100

#Dev admin seed - resolved only under the dev profile, no defaults on purpose
app.seed.admin-email=${SEED_ADMIN_EMAIL}
app.seed.admin-password=${SEED_ADMIN_PASSWORD}

#Google sign-in - the dummy defaults keep the app startable without real credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
#Where to send the browser afterwards - paths on the separate frontend app
app.oauth2.success-path=${OAUTH2_SUCCESS_PATH:/}
app.oauth2.failure-path=${OAUTH2_FAILURE_PATH:/login}
#Keep applicationTaskExecutor (used by the notification SSE stream) once WebSocket registers its own executors; without it startup fails
spring.task.execution.mode=force
