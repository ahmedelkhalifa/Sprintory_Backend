# Only active under @ActiveProfiles("test"); never used for normal app startup.
# @ServiceConnection overrides these deliberately unusable JDBC settings with
# the disposable PostgreSQL container. A misconfigured test cannot hit a real DB.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/DO_NOT_USE
spring.datasource.username=unused
spring.datasource.password=unused
spring.jpa.hibernate.ddl-auto=create-drop

# Valid-length local-only HS256 test key; no secrets/environment files required.
app.jwt.secret=sprintory-context-tests-only-0123456789abcdef0123456789abcdef

# The dev-only admin seeder must not run in the test profile.
